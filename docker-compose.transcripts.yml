services:
  transcripts-mongo:
    container_name: "transcripts-mongo"
    image: "mongo:8.0.11"
    ports:
      - "27018:27017"
    volumes:
      - transcripts_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30

volumes:
  transcripts_data:
