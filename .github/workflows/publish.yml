name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4  # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: npm install -g npm@latest   # OIDC publishing requires npm >= 11.5.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build

      - run: npm publish --access public
        # No NODE_AUTH_TOKEN needed — authenticated via GitHub OIDC trusted publisher
