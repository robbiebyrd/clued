name: Mind palace

on:
  push:
    paths:
      - 'mind-palace/**'
      - 'hooks/**'
      - 'hooks.json'
      - 'skills/**'
      - 'commands/**'
      - 'scripts/**'
      - '.mcp.json'
      - '.claude-plugin/plugin.json'
      - 'Dockerfile.server'
      - '.dockerignore'
      - '.github/workflows/mind-palace.yml'
  # Re-runs the checks and, on main, the release of the version the plugin
  # manifest names when it has none yet (see the release job).
  workflow_dispatch:
  pull_request:
    paths:
      - 'mind-palace/**'
      - 'hooks/**'
      - 'hooks.json'
      - 'skills/**'
      - 'commands/**'
      - 'scripts/**'
      - '.mcp.json'
      - '.claude-plugin/plugin.json'
      - 'Dockerfile.server'
      - '.dockerignore'
      - '.github/workflows/mind-palace.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: mind-palace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mind-palace/go.mod
          cache-dependency-path: mind-palace/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
        env:
          MIND_PALACE_TEST_MONGODB_URI: mongodb://127.0.0.1:27017

  binaries:
    # Every platform the plugin supports must still compile. One job per
    # target (the matrix mirrors TARGETS in scripts/build-binaries.sh) so
    # they build side by side; each uploads its binary as an artifact
    # (kept a week, never committed) that the release job collects, so a
    # release never compiles twice.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin/amd64
          - darwin/arm64
          - linux/amd64
          - linux/arm64
          - linux/arm
          - windows/amd64
          - windows/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mind-palace/go.mod
          cache-dependency-path: mind-palace/go.sum
      - name: The plugin manifest pins a release
        run: jq -e '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' .claude-plugin/plugin.json
      - name: The matrix lists every target of the build script
        run: diff <(scripts/build-binaries.sh --targets) <(python3 -c 'import yaml; print("\n".join(yaml.safe_load(open(".github/workflows/mind-palace.yml"))["jobs"]["binaries"]["strategy"]["matrix"]["target"]))')
      - id: build
        run: |
          scripts/build-binaries.sh --target "${{ matrix.target }}" "$RUNNER_TEMP/binaries"
          echo "name=mind-palace-binary-${{ matrix.target }}" | tr '/' '-' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ runner.temp }}/binaries/mind-palace_*
          retention-days: 7
          if-no-files-found: error

  image:
    # Dockerfile.server must keep assembling from the Linux binaries the
    # matrix built (it compiles nothing itself); the image is not pushed
    # here (the release job publishes it).
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mind-palace-binary-linux-*
          merge-multiple: true
          path: dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ghcr.io/robbiebyrd/clued-server:ci

  release:
    # Releases are cut by CI, never by a tag pushed by hand: on a push to
    # main (or a manual run) whose .claude-plugin/plugin.json names a version
    # with no GitHub release yet, and once the jobs above passed, this job
    # collects the binaries the matrix built, assembles and pushes the server
    # image as ghcr.io/robbiebyrd/clued-server:v<version> and :latest from
    # the Linux ones (nothing is compiled again), and creates
    # the release v<version> with the binaries and SHA256SUMS, which also
    # creates the tag at this commit. scripts/clued downloads that release
    # and `mind-palace server init` pins that image. A push whose version is
    # already released changes nothing here, so bumping the version in the
    # manifest is the whole release procedure.
    needs: [test, binaries, image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Is the manifest's version released?
        # A release counts as published when it carries every asset the
        # build script produces (its targets plus SHA256SUMS); one that
        # exists but lacks assets (a failed or partial upload) is completed
        # by the next run instead of being left broken.
        run: |
          version=$(jq -r '.version // empty' .claude-plugin/plugin.json)
          if [ -z "$version" ]; then
            echo "no version in .claude-plugin/plugin.json" >&2
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          want=$(( $(grep -cE '^  (darwin|linux|windows)/[a-z0-9]+$' scripts/build-binaries.sh) + 1 ))
          if assets=$(gh release view "$tag" --json assets --jq '.assets | length' 2>/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$assets" -ge "$want" ]; then
              echo "release $tag exists with $assets assets; nothing to publish"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "release $tag exists with $assets of $want assets; completing it from $GITHUB_SHA"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publishing $tag from $GITHUB_SHA"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        name: Collect the binaries the matrix built
        uses: actions/download-artifact@v4
        with:
          pattern: mind-palace-binary-*
          merge-multiple: true
          path: release-assets
      - if: steps.version.outputs.publish == 'true'
        name: Write SHA256SUMS
        run: scripts/build-binaries.sh --sums release-assets
      - if: steps.version.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.version.outputs.publish == 'true'
        name: Push the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BINARIES=release-assets
          tags: |
            ghcr.io/robbiebyrd/clued-server:${{ steps.version.outputs.tag }}
            ghcr.io/robbiebyrd/clued-server:latest
      - if: steps.version.outputs.publish == 'true'
        name: Create the release and its tag, or complete its assets
        # `gh release create` creates the tag at --target when it does not
        # exist yet; a tag that already exists is used as it is. An existing
        # release keeps its tag and notes and gets the assets (re)uploaded.
        run: |
          tag="${{ steps.version.outputs.tag }}"
          ls -l release-assets
          if [ "${{ steps.version.outputs.exists }}" = "true" ]; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes release-assets/*
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'
