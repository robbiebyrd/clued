name: Mind palace

on:
  push:
    paths:
      - 'mind-palace/**'
      - 'hooks/**'
      - 'hooks.json'
      - 'bin/**'
      - 'skills/**'
      - 'commands/**'
      - '.mcp.json'
      - '.github/workflows/mind-palace.yml'
  pull_request:
    paths:
      - 'mind-palace/**'
      - 'hooks/**'
      - 'hooks.json'
      - 'bin/**'
      - 'skills/**'
      - 'commands/**'
      - '.mcp.json'
      - '.github/workflows/mind-palace.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: mind-palace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mind-palace/go.mod
          cache-dependency-path: mind-palace/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
        env:
          MIND_PALACE_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
