name: Mind palace

on:
  # Pushes to main only: a branch with a pull request is checked by the
  # pull_request trigger below, so pushing to it does not run everything
  # twice. The release job needs the push to main.
  push:
    branches: [main]
    paths:
      - 'mind-palace/**'
      - 'hooks/**'
      - 'skills/**'
      - 'commands/**'
      - 'scripts/**'
      - '.mcp.json'
      - '.claude-plugin/plugin.json'
      - '.claude-plugin/marketplace.json'
      - 'LICENSE'
      - 'NOTICE'
      - 'Dockerfile.server'
      - '.dockerignore'
      - '.github/workflows/mind-palace.yml'
  # Re-runs the checks and, on main, publishes or completes the release of
  # the version the plugin manifest names; it never bumps the version (see
  # the release job).
  workflow_dispatch:
  pull_request:
    paths:
      - 'mind-palace/**'
      - 'hooks/**'
      - 'skills/**'
      - 'commands/**'
      - 'scripts/**'
      - '.mcp.json'
      - '.claude-plugin/plugin.json'
      - '.claude-plugin/marketplace.json'
      - 'LICENSE'
      - 'NOTICE'
      - 'Dockerfile.server'
      - '.dockerignore'
      - '.github/workflows/mind-palace.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: mind-palace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mind-palace/go.mod
          cache-dependency-path: mind-palace/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
        env:
          MIND_PALACE_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      - name: No dependency under a forbidden, restricted or unknown licence
        # github.com/segmentio/asm is MIT No Attribution, which the
        # classifier does not recognise (scripts/build-binaries.sh
        # --licenses copies its LICENSE by hand).
        run: go run github.com/google/go-licenses/v2@v2.0.1 check ./... --disallowed_types=forbidden,restricted,unknown --ignore github.com/segmentio/asm

  version:
    # What this run would release (scripts/release-plan.sh), decided before
    # the builds so the matrix stamps that version into the binaries the
    # release job then publishes as they are. Off main nothing is released
    # and the binaries carry the manifest's version.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      action: ${{ steps.plan.outputs.action }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          event=other
          if [ "${{ github.ref }}" = refs/heads/main ]; then
            case "${{ github.event_name }}" in
              push) event=push ;;
              workflow_dispatch) event=dispatch ;;
            esac
          fi
          scripts/release-plan.sh "$event" | tee -a "$GITHUB_OUTPUT"

  binaries:
    # Every platform the plugin supports must still compile. One job per
    # target (the matrix mirrors TARGETS in scripts/build-binaries.sh) so
    # they build side by side, each stamped with the version the version
    # job chose; each uploads its binary as an artifact (kept a week, never
    # committed) that the image and release jobs reuse, so a release never
    # compiles twice.
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin/amd64
          - darwin/arm64
          - linux/amd64
          - linux/arm64
          - linux/arm
          - windows/amd64
          - windows/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mind-palace/go.mod
          cache-dependency-path: mind-palace/go.sum
      - name: The plugin manifest pins a release
        run: jq -e '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' .claude-plugin/plugin.json
      - name: The matrix lists every target of the build script
        run: diff <(scripts/build-binaries.sh --targets) <(python3 -c 'import yaml; print("\n".join(yaml.safe_load(open(".github/workflows/mind-palace.yml"))["jobs"]["binaries"]["strategy"]["matrix"]["target"]))')
      - id: build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          scripts/build-binaries.sh --target "${{ matrix.target }}" "$RUNNER_TEMP/binaries"
          echo "name=mind-palace-binary-${{ matrix.target }}" | tr '/' '-' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ runner.temp }}/binaries/mind-palace_*
          retention-days: 7
          if-no-files-found: error

  image:
    # Dockerfile.server must keep assembling from the Linux binaries the
    # matrix built (it compiles nothing itself); the image is not pushed
    # here (the release job publishes it).
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mind-palace-binary-linux-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: mind-palace/go.mod
          cache-dependency-path: mind-palace/go.sum
      - name: Third-party licences for /usr/share/licenses/clued-server/
        run: scripts/build-binaries.sh --licenses dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ghcr.io/robbiebyrd/clued-server:ci

  release:
    # Releases are cut by CI, never by a tag pushed by hand, and every push
    # to main is a release. scripts/release-plan.sh decides what: a version
    # in .claude-plugin/plugin.json with no GitHub release yet (a minor or
    # major bumped by hand) is released as it is; on a push whose version is
    # released, the next patch version is (bumped in plugin.json and
    # marketplace.json, committed to main as "Release v<next> [skip ci]";
    # the token's push starts no workflow); a release missing assets is
    # completed; a manual run or a "Release v" HEAD bumps nothing.
    #
    # The binaries were built by the matrix from the pushed commit, stamped
    # with the version the version job chose, so this job publishes them as
    # they are when that still holds on the latest main: main's code
    # (everything outside .claude-plugin/) is the pushed commit's, and the
    # plan gives the same version. When main's code moved past the pushed
    # commit, a later push's run releases the newer code and this run
    # publishes nothing. When only the plan changed (a release that was
    # still running when the version job looked finished in between, so
    # the version it stamped is taken), this job rebuilds the binaries
    # here with the version it releases instead of leaving the push
    # unreleased.
    #
    # Publishing writes SHA256SUMS over the collected binaries, assembles
    # and pushes ghcr.io/robbiebyrd/clued-server:v<version> and :latest from
    # the Linux ones and creates the release v<version> with every binary,
    # SHA256SUMS and THIRD_PARTY_LICENSES.tar.gz, which also creates the
    # tag at the commit released. scripts/clued
    # downloads that release and `mind-palace server init` pins that image.
    needs: [version, test, binaries, image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The latest main, not the pushed commit: a bump lands on top of
          # whatever merged since. Full history, to compare with the
          # pushed commit.
          ref: main
          fetch-depth: 0
      - id: version
        name: Which version does this run release?
        run: |
          set -euo pipefail
          publish=false
          if ! git diff --quiet "$GITHUB_SHA" HEAD -- . ':(exclude).claude-plugin'; then
            echo "::notice::main's code moved past $GITHUB_SHA; the later push's run releases it"
            plan="version=${{ needs.version.outputs.version }}"$'\n'"action=none"$'\n'"exists=false"
          else
            event=push
            [ "${{ github.event_name }}" = push ] || event=dispatch
            plan=$(scripts/release-plan.sh "$event")
          fi
          version=$(sed -n 's/^version=//p' <<<"$plan")
          action=$(sed -n 's/^action=//p' <<<"$plan")
          exists=$(sed -n 's/^exists=//p' <<<"$plan")
          rebuild=false
          if [ "$action" != none ] && [ "$version" != "${{ needs.version.outputs.version }}" ]; then
            echo "::notice::the matrix's binaries carry v${{ needs.version.outputs.version }} but this run releases v$version; rebuilding them"
            rebuild=true
          fi
          if [ "$action" = bump ]; then
            current=$(jq -r .version .claude-plugin/plugin.json)
            echo "v$current is released; bumping main to v$version"
            sed -i -E "s/\"version\": \"$current\"/\"version\": \"$version\"/" .claude-plugin/plugin.json .claude-plugin/marketplace.json
            jq -e --arg v "$version" '.version == $v' .claude-plugin/plugin.json >/dev/null
            jq -e --arg v "$version" 'all(.plugins[]; .version == $v)' .claude-plugin/marketplace.json >/dev/null
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release v$version [skip ci]"
            git push origin HEAD:main
          fi
          [ "$action" = none ] || publish=true
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "sha=$(git rev-parse HEAD)"
            echo "exists=$exists"
            echo "publish=$publish"
            echo "rebuild=$rebuild"
          } >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.publish == 'true' && steps.version.outputs.rebuild != 'true'
        name: Collect the binaries the matrix built
        uses: actions/download-artifact@v4
        with:
          pattern: mind-palace-binary-*
          merge-multiple: true
          path: release-assets
      - if: steps.version.outputs.publish == 'true' && steps.version.outputs.rebuild != 'true'
        name: Write SHA256SUMS
        run: scripts/build-binaries.sh --sums release-assets
      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: mind-palace/go.mod
          cache-dependency-path: mind-palace/go.sum
      - if: steps.version.outputs.rebuild == 'true'
        name: Rebuild the binaries with the version released
        # main's code is the pushed commit's (checked above), so this is
        # the matrix's build again with the right version stamped in;
        # SHA256SUMS is written with it.
        run: scripts/build-binaries.sh release-assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - if: steps.version.outputs.publish == 'true'
        name: Third-party licences (release asset and image)
        # THIRD_PARTY_LICENSES/ is copied into the image and
        # THIRD_PARTY_LICENSES.tar.gz attached to the release; the
        # release plan's asset count does not include it, so a release
        # published before it existed is not reopened for it.
        run: scripts/build-binaries.sh --licenses release-assets
      - if: steps.version.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.version.outputs.publish == 'true'
        name: Push the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BINARIES=release-assets
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/robbiebyrd/clued-server:${{ steps.version.outputs.tag }}
            ghcr.io/robbiebyrd/clued-server:latest
      - if: steps.version.outputs.publish == 'true'
        name: Create the release and its tag, or complete its assets
        # `gh release create` creates the tag at --target when it does not
        # exist yet; a tag that already exists is used as it is. An existing
        # release keeps its tag and notes and gets the assets (re)uploaded.
        run: |
          tag="${{ steps.version.outputs.tag }}"
          ls -l release-assets
          assets=(release-assets/mind-palace_* release-assets/SHA256SUMS release-assets/THIRD_PARTY_LICENSES.tar.gz)
          if [ "${{ steps.version.outputs.exists }}" = "true" ]; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" --target "${{ steps.version.outputs.sha }}" --title "$tag" --generate-notes "${assets[@]}"
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'
