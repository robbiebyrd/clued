name: Mind palace

on:
  push:
    paths:
      - 'mind-palace/**'
      - 'hooks/**'
      - 'hooks.json'
      - 'skills/**'
      - 'commands/**'
      - 'scripts/**'
      - '.mcp.json'
      - '.claude-plugin/plugin.json'
      - 'Dockerfile.server'
      - '.dockerignore'
      - '.github/workflows/mind-palace.yml'
  pull_request:
    paths:
      - 'mind-palace/**'
      - 'hooks/**'
      - 'hooks.json'
      - 'skills/**'
      - 'commands/**'
      - 'scripts/**'
      - '.mcp.json'
      - '.claude-plugin/plugin.json'
      - 'Dockerfile.server'
      - '.dockerignore'
      - '.github/workflows/mind-palace.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: mind-palace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mind-palace/go.mod
          cache-dependency-path: mind-palace/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
        env:
          MIND_PALACE_TEST_MONGODB_URI: mongodb://127.0.0.1:27017

  binaries:
    # Every platform the plugin supports must still compile; the binaries
    # are kept as a workflow artifact for a week (release.yml publishes the
    # ones scripts/clued downloads, on v* tags) and never committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mind-palace/go.mod
          cache-dependency-path: mind-palace/go.sum
      - name: The plugin manifest pins a release
        run: jq -e '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' .claude-plugin/plugin.json
      - run: scripts/build-binaries.sh "$RUNNER_TEMP/binaries"
      - uses: actions/upload-artifact@v4
        with:
          name: mind-palace-binaries
          path: ${{ runner.temp }}/binaries
          retention-days: 7

  image:
    # Dockerfile.server must keep building from the current source; the
    # image is not pushed here (release.yml publishes it on v* tags).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: false
          tags: ghcr.io/robbiebyrd/clued-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
