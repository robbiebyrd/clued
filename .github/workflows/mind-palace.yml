name: Mind palace

on:
  push:
    paths:
      - 'mind-palace/**'
      - 'hooks/**'
      - 'hooks.json'
      - 'skills/**'
      - 'commands/**'
      - 'scripts/**'
      - '.mcp.json'
      - '.claude-plugin/plugin.json'
      - 'Dockerfile.server'
      - '.dockerignore'
      - '.github/workflows/mind-palace.yml'
  # Re-runs the checks and, on main, publishes or completes the release of
  # the version the plugin manifest names; it never bumps the version (see
  # the release job).
  workflow_dispatch:
  pull_request:
    paths:
      - 'mind-palace/**'
      - 'hooks/**'
      - 'hooks.json'
      - 'skills/**'
      - 'commands/**'
      - 'scripts/**'
      - '.mcp.json'
      - '.claude-plugin/plugin.json'
      - 'Dockerfile.server'
      - '.dockerignore'
      - '.github/workflows/mind-palace.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: mind-palace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mind-palace/go.mod
          cache-dependency-path: mind-palace/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
        env:
          MIND_PALACE_TEST_MONGODB_URI: mongodb://127.0.0.1:27017

  binaries:
    # Every platform the plugin supports must still compile; the binaries
    # are kept as a workflow artifact for a week (the release job publishes
    # the ones scripts/clued downloads) and never committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mind-palace/go.mod
          cache-dependency-path: mind-palace/go.sum
      - name: The plugin manifest pins a release
        run: jq -e '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' .claude-plugin/plugin.json
      - run: scripts/build-binaries.sh "$RUNNER_TEMP/binaries"
      - uses: actions/upload-artifact@v4
        with:
          name: mind-palace-binaries
          path: ${{ runner.temp }}/binaries
          retention-days: 7

  image:
    # Dockerfile.server must keep building from the current source; the
    # image is not pushed here (the release job publishes it).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: false
          tags: ghcr.io/robbiebyrd/clued-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # Releases are cut by CI, never by a tag pushed by hand, and every push
    # to main is a release: once the jobs above passed, this job looks at
    # the version .claude-plugin/plugin.json names on the latest main.
    #   - no GitHub release yet (a bump merged by hand, say to a new minor):
    #     it is released as it is;
    #   - released already and this is a push: the patch version is bumped
    #     in plugin.json and marketplace.json, committed to main as
    #     "Release v<next> [skip ci]" (the token's push starts no workflow),
    #     and that commit is released;
    #   - released already and the latest commit is such a bump, or this is
    #     a manual run: nothing to do;
    #   - released but missing assets (a failed upload): completed.
    # Releasing builds the binaries with scripts/build-binaries.sh, pushes
    # the server image as ghcr.io/robbiebyrd/clued-server:v<version> and
    # :latest, and creates the release v<version> with the binaries and
    # SHA256SUMS, which also creates the tag. scripts/clued downloads that
    # release and `mind-palace server init` pins that image.
    needs: [test, binaries, image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The latest main, not the pushed commit: a bump lands on top of
          # whatever merged since, and the release is built from it.
          ref: main
      - id: version
        name: Which version does this push release?
        run: |
          set -euo pipefail
          bump() { awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}' <<<"$1"; }
          assets() { gh release view "v$1" --json assets --jq '.assets | length' 2>/dev/null; }
          version=$(jq -r '.version // empty' .claude-plugin/plugin.json)
          if [ -z "$version" ]; then
            echo "no version in .claude-plugin/plugin.json" >&2
            exit 1
          fi
          # A release counts as published when it carries every asset the
          # build script produces (its targets plus SHA256SUMS).
          want=$(( $(grep -cE '^  (darwin|linux|windows)/[a-z0-9]+$' scripts/build-binaries.sh) + 1 ))
          exists=false
          publish=false
          if n=$(assets "$version"); then
            exists=true
            if [ "$n" -lt "$want" ]; then
              echo "release v$version exists with $n of $want assets; completing it"
              publish=true
            elif [ "${{ github.event_name }}" != push ]; then
              echo "release v$version exists with $n assets; a manual run bumps nothing"
            elif git log -1 --format=%s | grep -q '^Release v'; then
              echo "main is at the bump of v$version, which is released; nothing to publish"
            else
              next=$(bump "$version")
              while assets "$next" >/dev/null; do next=$(bump "$next"); done
              echo "v$version is released; bumping main to v$next"
              sed -i -E "s/\"version\": \"$version\"/\"version\": \"$next\"/" .claude-plugin/plugin.json .claude-plugin/marketplace.json
              jq -e --arg v "$next" '.version == $v' .claude-plugin/plugin.json >/dev/null
              jq -e --arg v "$next" 'all(.plugins[]; .version == $v)' .claude-plugin/marketplace.json >/dev/null
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -am "Release v$next [skip ci]"
              git push origin HEAD:main
              version=$next
              exists=false
              publish=true
            fi
          else
            echo "v$version has no release yet; publishing it"
            publish=true
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "sha=$(git rev-parse HEAD)"
            echo "exists=$exists"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: mind-palace/go.mod
          cache-dependency-path: mind-palace/go.sum
      - if: steps.version.outputs.publish == 'true'
        name: Build every platform
        run: scripts/build-binaries.sh release-assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - if: steps.version.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.version.outputs.publish == 'true'
        name: Push the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/robbiebyrd/clued-server:${{ steps.version.outputs.tag }}
            ghcr.io/robbiebyrd/clued-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.version.outputs.publish == 'true'
        name: Create the release and its tag, or complete its assets
        # `gh release create` creates the tag at --target when it does not
        # exist yet; a tag that already exists is used as it is. An existing
        # release keeps its tag and notes and gets the assets (re)uploaded.
        run: |
          tag="${{ steps.version.outputs.tag }}"
          ls -l release-assets
          if [ "${{ steps.version.outputs.exists }}" = "true" ]; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" --target "${{ steps.version.outputs.sha }}" --title "$tag" --generate-notes release-assets/*
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'
