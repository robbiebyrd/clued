# The clued server with its MongoDB: `docker compose -f docker-compose.server.yml up -d`.
# See docs/server.md for tokens, TLS, the client setup and the config files.
#
# Before the first start:
#   mkdir -p clued-server/tls
#   mind-palace server token create --tokens clued-server/tokens.json --name laptop --project '*'
# The token file is written 0600 by the user who minted it; the container
# runs as that user (CLUED_SERVER_USER, default uid 1000) so it can read it.
services:
  clued-server:
    image: ghcr.io/robbiebyrd/clued-server:latest
    # `docker compose build` (or `up --build`) builds the image from this
    # checkout instead of pulling the published one.
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: clued-server
    restart: unless-stopped
    user: "${CLUED_SERVER_USER:-1000:1000}"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      CLUED_SERVER_ADDR: 0.0.0.0:8443
      CLUED_SERVER_TOKENS: /etc/clued/tokens.json
      MIND_PALACE_CONFIG: /etc/clued/mind-palace.config.yaml
      CLUED_MONGO_URL: mongodb://mongo:27017
      CLUED_DB_NAME: claude_sessions
      # Plain HTTP inside the compose network: a reverse proxy on the host
      # (Caddy, nginx, a load balancer) terminates TLS and forwards to
      # 127.0.0.1:8443. To terminate TLS in the server instead, remove
      # CLUED_SERVER_BEHIND_PROXY, set the two TLS variables and publish the
      # port on every interface ("8443:8443").
      CLUED_SERVER_BEHIND_PROXY: "true"
      # CLUED_SERVER_TLS_CERT: /etc/clued/tls/cert.pem
      # CLUED_SERVER_TLS_KEY: /etc/clued/tls/key.pem
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./clued-server/tokens.json:/etc/clued/tokens.json:ro
      - ./mind-palace.config.server.yaml:/etc/clued/mind-palace.config.yaml:ro
      - ./clued-server/tls:/etc/clued/tls:ro

  mongo:
    image: mongo:8
    container_name: clued-mongo
    restart: unless-stopped
    # Not published: only the server reaches it over the compose network.
    volumes:
      - clued_mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30

volumes:
  clued_mongo_data:
