# Pinned public repositories of the code search evaluation (plan 0012-cgi,
# 5.1): one or two well-known repositories per language the code graph
# parses besides Go, each at the commit its tasks' ground truth was read at
# (the head of branch on 2026-10-19, resolved with `git ls-remote`). The
# harness fetches exactly that commit (`git fetch --depth 1 origin <commit>`);
# move a pin only together with the ground truth of its tasks, and check it
# with CLUED_EVAL_VERIFY=1 (scripts/eval-codesearch.sh --verify-only).
