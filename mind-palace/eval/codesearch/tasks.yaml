    prompt: Where is the project slug function `projects.Slug` defined, and which functions outside its package call it?
    truth:
      files: [mind-palace/server/projects/projects.go, mind-palace/clientcfg/clientcfg.go, mind-palace/session/model.go]
      symbols: [Slug, ResolveProject, ProjectSlugOf]
  - id: clued-named-limits-due
    repo: clued
    lang: go
    family: named
    prompt: Where is `limits.Due` defined and where is it called?
    truth:
      files: [mind-palace/session/limits/limits.go, mind-palace/cli/hook_status.go]
      symbols: [Due, hookStatusCmd]
  - id: clued-named-matchstop
    repo: clued
    lang: go
    family: named
    prompt: Where is `MatchStop` defined, and which functions lead to it from the stop-guard hook's JSON input?
    truth:
      files: [mind-palace/hookguard/stop.go]
      symbols: [MatchStop, CheckStop, CheckStopJSON]
  - id: clued-named-exportsession
    repo: clued
    lang: go
    family: named
    prompt: Where is the OpenTelemetry `ExportSession` method defined, and from where is it called?
    truth:
      files: [mind-palace/session/otel/export.go, mind-palace/session/daemon/daemon.go, mind-palace/cli/session.go, mind-palace/cli/hook_relay.go]
