# Tasks of the code search evaluation (plan 0012-cgi, 5.1).
#
# Each task is a prompt with its ground truth: the repository-relative files
# and the symbols a correct answer names (min_recall, default 1, is the share
# of each list it must name). Families: named (a symbol by name), concept (a
# behaviour described in words), impact (what a change reaches) and edit (a
# small change over two or three files, checked by `check`, a bash command
# run at the checkout's root).
#
# repo is clued (this repository at HEAD), clued-cloud, or a corpus.yaml id
# (pinned commit). The clued ground truth is checked against this checkout by
# harness_test.go on every `go test`; clued-cloud's when CLUED_EVAL_CLOUD_DIR
# names a checkout; the corpus's when CLUED_EVAL_VERIFY=1 (it fetches the
# pinned commits).
tasks:
  # --- clued: named lookups ---------------------------------------------------
  - id: clued-named-allocateid
    repo: clued
    lang: go
    family: named
    prompt: Where is `allocateID` defined, and which function calls it?
    truth:
      files: [mind-palace/service/documents.go]
      symbols: [allocateID, Create]
  - id: clued-named-hashtoken
    repo: clued
    lang: go
    family: named
    prompt: Where is `HashToken` defined in the clued server's authentication, and which functions use it?
    truth:
      files: [mind-palace/server/auth/auth.go]
      symbols: [HashToken, match, appendToken]
  - id: clued-named-checkurl
    repo: clued
    lang: go
    family: named
    prompt: Where is `checkURL` in the remote client defined, who calls it, and what helper does it use for the host?
    truth:
